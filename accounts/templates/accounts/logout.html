{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logged Out - SmartSpend</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="{% static 'accounts/css/logout.css' %}">
</head>

<body>

    <div class="logout-card">
        <div class="logout-icon-box">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
        </div>

        <h1 class="logout-title">You've been logged out</h1>
        <p class="logout-subtitle">Thank you for using SmartSpend Expense Tracker. We hope to see you again soon!</p>

        <div class="logout-actions">
            <a href="{% url 'login' %}" class="btn-login-again">Log In Again</a>
            <a href="{% url 'home' %}" class="btn-home-link">Go to Home</a>
        </div>
    </div>

</body>

</html>
