<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="femaleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE7F3" />
      <stop offset="100%" stop-color="#F3E8FF" />
    </linearGradient>
    <linearGradient id="femaleHair" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3730A3" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="femaleShirt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#BE185D" />
    </linearGradient>
    <linearGradient id="femaleSkin" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="58" fill="url(#femaleBg)" stroke="#F472B6" stroke-width="2.5" />

  <!-- Back Hair -->
  <path d="M30 60 C30 30, 90 30, 90 60 C92 78, 88 95, 82 102 C78 100, 75 92, 75 92 C75 92, 45 92, 45 92 C45 92, 42 100, 38 102 C32 95, 28 78, 30 60 Z" fill="url(#femaleHair)" />

  <!-- Neck -->
  <rect x="52" y="70" width="16" height="18" rx="4" fill="#FDE68A" />

  <!-- Shoulders & Blouse -->
  <path d="M26 112 C28 92, 42 84, 60 84 C78 84, 92 92, 94 112 C85 118, 35 118, 26 112 Z" fill="url(#femaleShirt)" />
  <!-- Blouse Collar V-cut -->
  <path d="M52 84 L60 96 L68 84 Z" fill="#FDE68A" />

  <!-- Head / Face -->
  <ellipse cx="60" cy="54" rx="22" ry="24" fill="#FDE68A" />

  <!-- Front Hair & Bangs -->
  <path d="M38 52 C38 34, 48 26, 60 26 C72 26, 82 34, 82 52 C78 40, 68 36, 60 42 C54 37, 44 42, 38 52 Z" fill="url(#femaleHair)" />
  <!-- Left Hair strand -->
  <path d="M38 48 C37 58, 39 68, 41 74 C42 75, 44 70, 44 64 C44 56, 42 50, 38 48 Z" fill="url(#femaleHair)" />
  <!-- Right Hair strand -->
  <path d="M82 48 C83 58, 81 68, 79 74 C78 75, 76 70, 76 64 C76 56, 78 50, 82 48 Z" fill="url(#femaleHair)" />

  <!-- Eyes -->
  <circle cx="51" cy="54" r="2.8" fill="#1E1B4B" />
  <circle cx="69" cy="54" r="2.8" fill="#1E1B4B" />
  <circle cx="52" cy="53" r="0.9" fill="#FFFFFF" />
  <circle cx="70" cy="53" r="0.9" fill="#FFFFFF" />

  <!-- Eyebrows -->
  <path d="M47 48 C49 46, 54 47, 55 49" stroke="#312E81" stroke-width="1.8" stroke-linecap="round" fill="none" />
  <path d="M65 49 C66 47, 71 46, 73 48" stroke="#312E81" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Cheeks Blush -->
  <circle cx="46" cy="59" r="3.2" fill="#F472B6" opacity="0.55" />
  <circle cx="74" cy="59" r="3.2" fill="#F472B6" opacity="0.55" />

  <!-- Smiling Lips -->
  <path d="M54 62 C56 66, 64 66, 66 62" stroke="#BE185D" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Hair Ribbon / Flower Pin -->
  <circle cx="78" cy="38" r="5" fill="#F43F5E" />
  <circle cx="78" cy="38" r="2" fill="#FEF08A" />
</svg>

